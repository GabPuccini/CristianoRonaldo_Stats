<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--
        TEMPORARY BRIDGE, NOT A PAGE.

        Achievements and honours is a section of the home page now. This file exists only so that
        /achievements.html does not return 404 for the people and crawlers that still
        hold the old link.

        The real fix is a Cloudflare Redirect Rule sending this URL to
        https://ronaldostats.app/#achievements with a 301. That is a genuine HTTP
        status and passes ranking signals; a meta refresh is only a hint Google
        may choose to follow, and slowly.

        Once that rule is live, delete this file. The rule fires at the edge, so
        the two can coexist safely in the meantime.

        Deliberately no robots noindex. noindex would tell Google to drop the URL
        without passing anything to the home page, throwing away what this page
        has earned rather than handing it over. The canonical consolidates.
    -->

    <link rel="canonical" href="https://ronaldostats.app/">
    <meta http-equiv="refresh" content="0; url=/#achievements">

    <title>Ronaldo achievements has moved to the home page</title>
    <meta name="description" content="Cristiano Ronaldo's team trophies and individual awards, club by club, are now a section of the home page.">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eaf0f9;
            color: #16243a;
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            text-align: center;
            padding: 24px;
        }
        p { font-size: 1.05rem; line-height: 1.6; max-width: 46ch; }
        a { color: #2f56cf; font-weight: 600; }
    </style>
</head>
<body>
    <p>
        Cristiano Ronaldo's achievements and honours are now part of the home page.
        <br>
        <a href="/#achievements">Continue to achievements</a>
    </p>
</body>
</html>
